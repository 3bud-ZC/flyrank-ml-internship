name: Execute final ML evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execute-final-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Hugging Face token
        run: |
          test -n "$HF_TOKEN"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt jupyter nbconvert ipykernel

      - name: Execute ML-04 live warehouse receipt
        run: |
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/w03_data_contract.ipynb --ExecutePreprocessor.timeout=1200

      - name: Execute final capstone notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/capstone.ipynb --ExecutePreprocessor.timeout=900

      - name: Verify notebook evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("work/notebooks/w03_data_contract.ipynb"),
              Path("work/notebooks/capstone.ipynb"),
          ]
          for path in paths:
              nb = json.loads(path.read_text(encoding="utf-8"))
              code = [c for c in nb["cells"] if c["cell_type"] == "code" and "".join(c.get("source", [])).strip()]
              executed = [c for c in code if c.get("execution_count") is not None]
              outputs = sum(len(c.get("outputs", [])) for c in code)
              print(f"{path}: {len(executed)}/{len(code)} code cells executed; outputs={outputs}")
              if len(executed) != len(code):
                  raise SystemExit(f"Unexecuted cell in {path}")
          receipt = json.loads(Path("work/outputs/w03_warehouse_receipt.json").read_text(encoding="utf-8"))
          assert receipt["executed_with_hf_token"] is True
          assert receipt["duplicate_grain_rows"] == 0
          print("ML-04 live warehouse receipt verified.")
          PY

      - name: Commit executed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w03_data_contract.ipynb work/notebooks/capstone.ipynb
          git add -f work/outputs/w03_warehouse_receipt.json
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "Execute final warehouse notebooks with verified evidence [skip ci]"
            git push
          fi
