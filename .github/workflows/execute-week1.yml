name: Execute Week 1 notebooks

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/01_first_look_and_discovery.ipynb'
      - 'notebooks/02_your_first_readable_model.ipynb'
      - 'work/notebooks/w01_research_question.ipynb'

permissions:
  contents: write

jobs:
  execute-week1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore large starter assets from the official template
        run: |
          set -euo pipefail
          mkdir -p data/raw docs
          curl -fsSL https://raw.githubusercontent.com/flyrank-bih/flyrank-ml-internship-starter/main/data/raw/content_refresh_anonymized.csv -o data/raw/content_refresh_anonymized.csv
          curl -fsSL https://raw.githubusercontent.com/flyrank-bih/flyrank-ml-internship-starter/main/docs/flyrank-seo-research-march-2026.pdf -o docs/flyrank-seo-research-march-2026.pdf
          test -s data/raw/content_refresh_anonymized.csv
          test -s docs/flyrank-seo-research-march-2026.pdf
          echo "CSV bytes: $(wc -c < data/raw/content_refresh_anonymized.csv)"
          echo "PDF bytes: $(wc -c < docs/flyrank-seo-research-march-2026.pdf)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt jupyter nbconvert ipykernel

      - name: Run starter pipeline
        run: python scripts/run_all.py

      - name: Execute starter notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/01_first_look_and_discovery.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace notebooks/02_your_first_readable_model.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/w01_research_question.ipynb --ExecutePreprocessor.timeout=900

      - name: Verify executed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          csv = Path("data/raw/content_refresh_anonymized.csv")
          df = pd.read_csv(csv)
          print(f"starter CSV: {len(df)} rows x {df.shape[1]} columns")
          if len(df) != 30000 or df.shape[1] != 44:
              raise SystemExit("Starter dataset does not match expected 30,000 x 44 shape.")

          paths = [
              Path("notebooks/01_first_look_and_discovery.ipynb"),
              Path("notebooks/02_your_first_readable_model.ipynb"),
              Path("work/notebooks/w01_research_question.ipynb"),
          ]
          for path in paths:
              nb = json.loads(path.read_text(encoding="utf-8"))
              code = [c for c in nb["cells"] if c["cell_type"] == "code" and "".join(c.get("source", [])).strip()]
              executed = [c for c in code if c.get("execution_count") is not None]
              outputs = sum(len(c.get("outputs", [])) for c in code)
              print(f"{path}: executed {len(executed)}/{len(code)} code cells, outputs={outputs}")
              if len(executed) != len(code):
                  raise SystemExit(f"Unexecuted code cell found in {path}")
          PY

      - name: Commit restored assets and executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/content_refresh_anonymized.csv docs/flyrank-seo-research-march-2026.pdf
          git add notebooks/01_first_look_and_discovery.ipynb notebooks/02_your_first_readable_model.ipynb work/notebooks/w01_research_question.ipynb
          git add outputs/model_results.json outputs/model_report.md outputs/refresh_queue.csv outputs/flyrank_refresh_model_results.pdf outputs/charts/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Complete Week 1 execution with verified outputs [skip ci]"
            git push
          fi
