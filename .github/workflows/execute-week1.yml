name: Execute Week 1 notebooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execute-week1.yml'
      - 'notebooks/01_first_look_and_discovery.ipynb'
      - 'notebooks/02_your_first_readable_model.ipynb'
      - 'work/notebooks/w01_research_question.ipynb'
      - 'scripts/**'
      - 'requirements.txt'
      - 'data/raw/content_refresh_anonymized.csv'

permissions:
  contents: write

jobs:
  execute-week1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt jupyter nbconvert ipykernel

      - name: Run starter pipeline
        run: python scripts/run_all.py

      - name: Execute starter notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/01_first_look_and_discovery.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace notebooks/02_your_first_readable_model.ipynb --ExecutePreprocessor.timeout=900
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/w01_research_question.ipynb --ExecutePreprocessor.timeout=900

      - name: Verify executed evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("notebooks/01_first_look_and_discovery.ipynb"),
              Path("notebooks/02_your_first_readable_model.ipynb"),
              Path("work/notebooks/w01_research_question.ipynb"),
          ]
          for path in paths:
              nb = json.loads(path.read_text(encoding="utf-8"))
              code = [c for c in nb["cells"] if c["cell_type"] == "code" and "".join(c.get("source", [])).strip()]
              executed = [c for c in code if c.get("execution_count") is not None]
              outputs = sum(len(c.get("outputs", [])) for c in code)
              print(f"{path}: executed {len(executed)}/{len(code)} code cells, outputs={outputs}")
              if len(executed) != len(code):
                  raise SystemExit(f"Unexecuted code cell found in {path}")
          PY

      - name: Commit executed notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_first_look_and_discovery.ipynb notebooks/02_your_first_readable_model.ipynb work/notebooks/w01_research_question.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute Week 1 notebooks with verified outputs [skip ci]"
            git push
          fi
