name: Execute Week 2 notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execute-week2.yml'
      - 'work/notebooks/w02_ml_task_framing.ipynb'

permissions:
  contents: write

jobs:
  execute-week2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert ipykernel

      - name: Execute ML-03 notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace work/notebooks/w02_ml_task_framing.ipynb --ExecutePreprocessor.timeout=900

      - name: Verify execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("work/notebooks/w02_ml_task_framing.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          code = [c for c in nb["cells"] if c["cell_type"] == "code" and "".join(c.get("source", [])).strip()]
          executed = [c for c in code if c.get("execution_count") is not None]
          outputs = sum(len(c.get("outputs", [])) for c in code)

          print(f"{path}: executed {len(executed)}/{len(code)} code cells, outputs={outputs}")
          if len(executed) != len(code):
              raise SystemExit("ML-03 contains an unexecuted code cell.")
          PY

      - name: Commit executed ML-03 notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/notebooks/w02_ml_task_framing.ipynb
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
          else
            git commit -m "Execute ML-03 with verified outputs [skip ci]"
            git push
          fi
